{% extends 'base.html' %}
{% block title %}Mot de passe oublié | AUDSTOREsarl{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-8">
    <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-8">
        <div class="text-center mb-6">
            <div class="w-12 h-12 bg-[#8CC63F]/15 rounded-xl flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-envelope text-[#8CC63F] text-xl"></i>
            </div>
            <h1 class="text-2xl font-black text-gray-900">Mot de passe oublié ?</h1>
            <p class="text-sm text-gray-500 mt-2">Entrez votre adresse email et nous vous enverrons un lien pour réinitialiser votre mot de passe.</p>
        </div>
        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label class="block text-xs font-semibold text-gray-600 mb-1.5">Adresse email</label>
                <input type="email" name="email" required placeholder="votre@email.com"
                    class="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-[#8CC63F] focus:ring-1 focus:ring-[#8CC63F]/30">
            </div>
            <button type="submit" class="w-full bg-[#8CC63F] hover:bg-[#7ab32f] text-black font-bold py-3 rounded-lg text-sm transition-colors">
                Envoyer le lien de réinitialisation
            </button>
        </form>
        <div class="text-center mt-4">
            <a href="{% url 'users:login' %}" class="text-xs text-gray-500 hover:text-gray-700 font-medium">
                <i class="fa-solid fa-arrow-left mr-1"></i> Retour à la connexion
            </a>
        </div>
    </div>
</div>
{% endblock %}
