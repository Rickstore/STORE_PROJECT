{% extends 'base.html' %}
{% block title %}Mot de passe modifié | AUDSTOREsarl{% endblock %}
{% block content %}
<div class="max-w-md mx-auto py-8">
    <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-8 text-center">
        <div class="w-12 h-12 bg-[#8CC63F]/15 rounded-xl flex items-center justify-center mx-auto mb-4">
            <i class="fa-solid fa-circle-check text-[#8CC63F] text-2xl"></i>
        </div>
        <h1 class="text-xl font-black text-gray-900 mb-2">Mot de passe modifié !</h1>
        <p class="text-sm text-gray-500 mb-6">Votre mot de passe a été réinitialisé avec succès. Vous pouvez maintenant vous connecter.</p>
        <a href="{% url 'users:login' %}" class="bg-[#8CC63F] hover:bg-[#7ab32f] text-black font-bold px-6 py-2.5 rounded-lg text-sm inline-block transition-colors">
            Se connecter
        </a>
    </div>
</div>
{% endblock %}
