{% extends 'base.html' %}
{% block title %}Email envoyé | AUDSTOREsarl{% endblock %}
{% block content %}
<div class="max-w-md mx-auto py-8">
    <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-8 text-center">
        <div class="w-12 h-12 bg-green-50 rounded-xl flex items-center justify-center mx-auto mb-4">
            <i class="fa-solid fa-paper-plane text-green-500 text-xl"></i>
        </div>
        <h1 class="text-xl font-black text-gray-900 mb-2">Email envoyé !</h1>
        <p class="text-sm text-gray-500 mb-6">Si un compte existe avec cette adresse, vous recevrez un lien de réinitialisation dans quelques minutes. Vérifiez vos spams.</p>
        <a href="{% url 'users:login' %}" class="bg-[#8CC63F] hover:bg-[#7ab32f] text-black font-bold px-6 py-2.5 rounded-lg text-sm inline-block transition-colors">
            Retour à la connexion
        </a>
    </div>
</div>
{% endblock %}
