{% extends 'base.html' %}

{% block title %}Catalogue | AUDSTOREsarl{% endblock %}

{% block content %}
<div class="flex flex-col md:flex-row gap-8">
    <!-- Filters Sidebar -->
    <aside class="w-full md:w-64 flex-shrink-0">
        <form action="{% url 'catalog:catalog' %}" method="get" class="bg-white dark:bg-[#1E1E1E] p-5 rounded-lg shadow-sm border border-gray-200 dark:border-white/5 transition-colors duration-500" id="filterForm">
            <!-- Hidden search query to preserve it -->
            {% if search_query %}
            <input type="hidden" name="q" value="{{ search_query }}">
            {% endif %}
            
            <h3 class="font-bold text-lg text-gray-800 dark:text-white mb-4 border-b dark:border-white/5 pb-2">Catégories</h3>
            <ul class="flex flex-wrap gap-2 mb-6">
                    <label class="cursor-pointer">
                        <input type="radio" name="category" value="" {% if not current_category %}checked{% endif %} class="hidden filter-input">
                        <span class="px-4 py-2 rounded-full border text-xs font-bold transition-all inline-block
                            {% if not current_category %}bg-brand-green border-brand-green text-black{% else %}bg-white dark:bg-white/5 border-gray-200 dark:border-white/10 text-gray-500 dark:text-gray-400 hover:border-brand-green hover:text-brand-green{% endif %}">
                            Tout
                        </span>
                    </label>
                </li>
                {% for category in categories %}
                <li>
                    <label class="cursor-pointer">
                        <input type="radio" name="category" value="{{ category.slug_cat }}" {% if current_category == category.slug_cat %}checked{% endif %} class="hidden filter-input">
                        <span class="px-4 py-2 rounded-full border text-xs font-bold transition-all inline-block
                            {% if current_category == category.slug_cat %}bg-brand-green border-brand-green text-black{% else %}bg-white dark:bg-white/5 border-gray-100 dark:border-white/10 text-gray-500 dark:text-gray-400 hover:border-brand-green hover:text-brand-green{% endif %}">
                            {{ category.nom_cat }}
                        </span>
                    </label>
                </li>
                {% endfor %}
            </ul>

            <h3 class="font-bold text-sm text-gray-800 dark:text-white mb-3 border-b dark:border-white/5 pb-2">Prix (FCFA)</h3>
            <div class="flex items-center space-x-2 mb-4">
                <input type="number" name="min_price" value="{{ current_min_price }}" placeholder="Min" class="w-full border-gray-200 rounded-md text-xs shadow-sm focus:ring-brand-green focus:border-brand-green border p-2">
                <span class="text-gray-400">-</span>
                <input type="number" name="max_price" value="{{ current_max_price }}" placeholder="Max" class="w-full border-gray-200 rounded-md text-xs shadow-sm focus:ring-brand-green focus:border-brand-green border p-2">
            </div>

            <h3 class="font-bold text-sm text-gray-800 dark:text-white mb-3 border-b dark:border-white/5 pb-2">État</h3>
            <div class="flex flex-wrap gap-2 mb-6">
                <label class="cursor-pointer">
                    <input type="radio" name="state" value="" {% if not current_state %}checked{% endif %} class="hidden filter-input">
                    <span class="px-3 py-1.5 rounded-full border text-[10px] font-bold transition-all inline-block
                        {% if not current_state %}bg-brand-green border-brand-green text-black{% else %}bg-white dark:bg-white/5 border-gray-200 dark:border-white/10 text-gray-500 dark:text-gray-400 hover:border-brand-green hover:text-brand-green{% endif %}">
                        Tout
                    </span>
                </label>
                <label class="cursor-pointer">
                    <input type="radio" name="state" value="second_hand" {% if current_state == 'second_hand' %}checked{% endif %} class="hidden filter-input">
                    <span class="px-3 py-1.5 rounded-full border text-[10px] font-bold transition-all inline-block
                        {% if current_state == 'second_hand' %}bg-orange-500 border-orange-500 text-white{% else %}bg-white dark:bg-white/5 border-gray-200 dark:border-white/10 text-gray-500 dark:text-gray-400 hover:border-orange-500 hover:text-orange-500{% endif %}">
                        Occasion
                    </span>
                </label>
            </div>
            
            <button type="submit" class="w-full bg-brand-dark hover:bg-black text-white font-bold py-2 rounded-md transition-all text-sm shadow-sm md:hidden">
                Filtrer
            </button>
        </form>
    </aside>

    <!-- Products Grid Container -->
    <div class="flex-grow" id="productListContainer">
        {% include 'catalog/product_list_partial.html' %}
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const filterForm = document.getElementById('filterForm');
    const productListContainer = document.getElementById('productListContainer');
    
    if (!filterForm || !productListContainer) return;

    // Fonction pour charger les produits via AJAX
    function loadProducts(url, updateHistory = true) {
        // Ajouter un indicateur de chargement
        productListContainer.style.opacity = '0.5';
        productListContainer.style.pointerEvents = 'none';

        fetch(url, {
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
        .then(response => response.text())
        .then(html => {
            productListContainer.innerHTML = html;
            productListContainer.style.opacity = '1';
            productListContainer.style.pointerEvents = 'auto';
            
            if (updateHistory) {
                window.history.pushState({}, '', url);
            }
            
            // Mettre à jour visuellement les filtres sélectionnés (Catégories et États)
            updateActiveFilters();
            
            // Re-lier les événements pour la nouvelle pagination ou recherche
            bindPaginationLinks();
        })
        .catch(error => {
            console.error('Error loading products:', error);
            productListContainer.style.opacity = '1';
            productListContainer.style.pointerEvents = 'auto';
        });
    }

    function updateActiveFilters() {
        // --- Categories ---
        const catRadios = filterForm.querySelectorAll('input[name="category"]');
        catRadios.forEach(radio => {
            const span = radio.nextElementSibling;
            if (radio.checked) {
                span.classList.remove('bg-white', 'dark:bg-white/5', 'border-gray-200', 'border-gray-100', 'dark:border-white/10', 'text-gray-500', 'dark:text-gray-400', 'hover:border-brand-green', 'hover:text-brand-green');
                span.classList.add('bg-brand-green', 'border-brand-green', 'text-black');
            } else {
                span.classList.remove('bg-brand-green', 'border-brand-green', 'text-black');
                span.classList.add('bg-white', 'dark:bg-white/5', 'border-gray-200', 'dark:border-white/10', 'text-gray-500', 'dark:text-gray-400', 'hover:border-brand-green', 'hover:text-brand-green');
            }
        });

        // --- States ---
        const stateRadios = filterForm.querySelectorAll('input[name="state"]');
        stateRadios.forEach(radio => {
            const span = radio.nextElementSibling;
            // The "Occasion" radio uses orange classes, others use green
            if (radio.checked) {
                if (radio.value === 'second_hand') {
                    span.classList.remove('bg-white', 'dark:bg-white/5', 'border-gray-200', 'dark:border-white/10', 'text-gray-500', 'dark:text-gray-400', 'hover:border-orange-500', 'hover:text-orange-500');
                    span.classList.add('bg-orange-500', 'border-orange-500', 'text-white');
                } else {
                    span.classList.remove('bg-white', 'dark:bg-white/5', 'border-gray-200', 'dark:border-white/10', 'text-gray-500', 'dark:text-gray-400', 'hover:border-brand-green', 'hover:text-brand-green');
                    span.classList.add('bg-brand-green', 'border-brand-green', 'text-black');
                }
            } else {
                if (radio.value === 'second_hand') {
                    span.classList.remove('bg-orange-500', 'border-orange-500', 'text-white');
                    span.classList.add('bg-white', 'dark:bg-white/5', 'border-gray-200', 'dark:border-white/10', 'text-gray-500', 'dark:text-gray-400', 'hover:border-orange-500', 'hover:text-orange-500');
                } else {
                    span.classList.remove('bg-brand-green', 'border-brand-green', 'text-black');
                    span.classList.add('bg-white', 'dark:bg-white/5', 'border-gray-200', 'dark:border-white/10', 'text-gray-500', 'dark:text-gray-400', 'hover:border-brand-green', 'hover:text-brand-green');
                }
            }
        });
    }

    // Intercepter les changements dans le formulaire
    filterForm.addEventListener('change', function(e) {
        if (e.target.classList.contains('filter-input') || e.target.type === 'radio' || e.target.type === 'number') {
            const formData = new FormData(filterForm);
            const params = new URLSearchParams(formData);
            const url = `${filterForm.action}?${params.toString()}`;
            loadProducts(url);
        }
    });

    // Optionnel : Gérer le clic sur "Filtrer" (pour mobile ou prix)
    filterForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const formData = new FormData(filterForm);
        const params = new URLSearchParams(formData);
        const url = `${filterForm.action}?${params.toString()}`;
        loadProducts(url);
    });

    // Intercepter la pagination
    function bindPaginationLinks() {
        document.querySelectorAll('.ajax-page-link').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                loadProducts(this.href);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        });
        
        // Gérer aussi le formulaire de recherche qui est dans le partial
        const searchForm = document.getElementById('catalogSearchForm');
        if (searchForm) {
            searchForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const formData = new FormData(searchForm);
                const params = new URLSearchParams(formData);
                const url = `${searchForm.action}?${params.toString()}`;
                loadProducts(url);
            });
        }
    }

    // Gérer le bouton "Précédent" du navigateur
    window.addEventListener('popstate', function() {
        loadProducts(window.location.href, false);
    });

    bindPaginationLinks();
});
</script>
{% endblock %}
