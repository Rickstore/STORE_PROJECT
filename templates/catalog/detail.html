{% extends 'base.html' %}

{% block title %}{{ product.nom_prod }} | AUDSTOREsarl{% endblock %}

{% block content %}
<style>
    #product-detail-container {
        transition: opacity 0.4s ease-out, transform 0.4s ease-out;
    }
    .loading-fade {
        opacity: 0.3 !important;
        transform: translateY(10px);
        pointer-events: none;
    }
</style>

<div id="product-detail-container">
    {% include 'catalog/product_detail_partial.html' %}
</div>

<script>
/**
 * Gestion dynamique des variantes de produit et du stock par boutique.
 * variants_json : { "Couleur_Capacité": { variant_id, price, stocks: {store_id: qty}, in_stock, image_url, ... } }
 */
function initializeProductDetail() {
    const container = document.getElementById('product-detail-container');
    if (!container) return;

    const variantsDataEl = document.getElementById('variants-data');
    const storesDataEl  = document.getElementById('stores-data');
    if (!variantsDataEl) return;

    let variants = {};
    let stores = [];
    try {
        variants = JSON.parse(variantsDataEl.textContent);
        if (storesDataEl) stores = JSON.parse(storesDataEl.textContent);
    } catch(e) {
        console.error("Erreur parsing JSON data", e);
    }

    const colorButtons = container.querySelectorAll('.color-selector');
    const capButtons   = container.querySelectorAll('.cap-selector');

    let selectedColor = container.querySelector('#id_selected_color')?.value || "";
    let selectedCap   = container.querySelector('#id_selected_capacity')?.value || "";
    let selectedStore = ""; 

    function getVariant(color, cap) {
        return variants[`${color}_${cap}`] || null;
    }

    function updateUI() {
        const match = getVariant(selectedColor, selectedCap);

        // --- Inputs cachés ---
        const hiddenVariant = container.querySelector('#id_variant_id');
        const hiddenColor   = container.querySelector('#id_selected_color');
        const hiddenCap     = container.querySelector('#id_selected_capacity');
        const hiddenStore   = container.querySelector('#id_store_id');
        
        if (hiddenColor)   hiddenColor.value   = selectedColor;
        if (hiddenCap)     hiddenCap.value     = selectedCap;
        if (hiddenStore)   hiddenStore.value   = selectedStore;
        if (hiddenVariant) hiddenVariant.value = match ? match.variant_id : '';

        // --- Prix ---
        const priceEl = container.querySelector('#product-price');
        if (priceEl && match) {
            priceEl.innerText = Number(match.price).toLocaleString('fr-FR') + ' FCFA';
        }

        // --- Couleur label ---
        const colorNameEl = container.querySelector('#color-name-display');
        if (colorNameEl && selectedColor) {
            colorNameEl.innerHTML = `Couleur : <span class="font-normal text-gray-500">${selectedColor}</span>`;
        }

        // --- Stock ---
        const stockEl = container.querySelector('#stock-info');
        let hasAnyStock = false;
        
        if (stockEl) {
            if (!match) {
                stockEl.innerHTML = `
                    <div class="flex items-center gap-2 px-3 py-1.5 bg-green-50 rounded-lg border border-green-100 shadow-sm">
                        <i class="fa-solid fa-check-circle text-green-500 text-xs"></i>
                        <span class="text-[11px] font-black text-green-700 uppercase tracking-widest">En stock</span>
                    </div>
                `;
            } else {
                stockEl.innerHTML = '';
                stores.forEach(s => {
                    const qty = match.stocks[s.id] || 0;
                    if (qty > 0) hasAnyStock = true;
                    
                    const bg = qty > 0 ? 'bg-green-50 border-green-100 text-green-700 shadow-sm' : 'bg-red-50 border-red-100 text-red-500 opacity-60';
                    const icon = qty > 0 ? 'fa-check-circle text-green-500' : 'fa-circle-xmark text-red-400';
                    const label = qty > 0 ? `En stock ${s.city}` : `Rupture ${s.city}`;
                    
                    const div = document.createElement('div');
                    div.className = `flex items-center gap-2 px-3 py-1.5 rounded-lg border transition-all ${bg}`;
                    div.innerHTML = `
                        <i class="fa-solid ${icon} text-[10px]"></i>
                        <span class="text-[10px] font-black uppercase tracking-wider">${label}</span>
                    `;
                    stockEl.appendChild(div);
                });
            }
        }

        // --- Image principale ---
        if (match && match.image_url) {
            const mainImg = container.querySelector('.main-product-image');
            const imgEl = mainImg || container.querySelector('.main-image-container img');
            if (imgEl && !imgEl.src.includes(match.image_url)) {
                imgEl.style.opacity = '0';
                setTimeout(() => { imgEl.src = match.image_url; imgEl.style.opacity = '1'; }, 180);
            }
        }

        // --- Bouton panier ---
        const addBtn = container.querySelector('.ajax-submit-cart');
        if (addBtn) {
            const disabled = !match || !hasAnyStock;
            addBtn.disabled = disabled;
            addBtn.classList.toggle('opacity-50', disabled);
            addBtn.classList.toggle('cursor-not-allowed', disabled);
            if (disabled && match) {
                 addBtn.innerHTML = '<i class="fa-solid fa-circle-xmark mr-2"></i> Rupture de stock';
            } else {
                 addBtn.innerHTML = '<i class="fa-solid fa-cart-shopping text-lg text-white"></i> Ajouter au panier';
            }
        }

        // --- Styles couleur ---
        colorButtons.forEach(b => {
            const ring  = b.querySelector('.swatch-ring');
            const label = b.querySelector('.swatch-label');
            const active = b.dataset.name === selectedColor;
            if (ring) {
                ring.classList.toggle('border-[#16A34A]', active);
                ring.classList.toggle('scale-110', active);
                ring.classList.toggle('shadow-md', active);
                ring.classList.toggle('ring-4', active);
                ring.classList.toggle('ring-[#16A34A]/10', active);
                ring.classList.toggle('border-transparent', !active);
            }
            if (label) {
                label.classList.toggle('text-[#16A34A]', active);
                label.classList.toggle('text-gray-400', !active);
            }
        });

        // --- Styles capacité + désactivation ---
        capButtons.forEach(b => {
            const cap    = b.dataset.value;
            const active = cap === selectedCap;
            const exists = selectedColor
                ? getVariant(selectedColor, cap) !== null
                : Object.keys(variants).some(k => k.endsWith(`_${cap}`));
            b.classList.toggle('border-[#16A34A]', active);
            b.classList.toggle('bg-[#F0FDF4]', active);
            b.classList.toggle('text-[#16A34A]', active);
            b.classList.toggle('shadow-md', active);
            b.classList.toggle('scale-105', active);
            b.classList.toggle('border-gray-100', !active);
            b.classList.toggle('text-gray-500', !active);
            b.classList.toggle('bg-gray-50/50', !active);
            b.classList.toggle('opacity-40', !exists);
            b.classList.toggle('line-through', !exists);
            exists ? b.removeAttribute('disabled') : b.setAttribute('disabled', 'disabled');
        });
    }

    colorButtons.forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.preventDefault();
            selectedColor = btn.dataset.name;
            if (selectedCap && !getVariant(selectedColor, selectedCap)) selectedCap = '';
            updateUI();
        });
    });

    capButtons.forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.preventDefault();
            if (btn.hasAttribute('disabled')) return;
            selectedCap = btn.dataset.value;
            if (selectedColor && !getVariant(selectedColor, selectedCap)) selectedColor = '';
            updateUI();
        });
    });

    // Zoom image
    const mainImageContainer = container.querySelector('.main-image-container');
    if (mainImageContainer) {
        mainImageContainer.addEventListener('mousemove', function(e) {
            const img = this.querySelector('img');
            if (!img) return;
            const rect = this.getBoundingClientRect();
            img.style.transformOrigin = `${((e.clientX - rect.left) / rect.width) * 100}% ${((e.clientY - rect.top) / rect.height) * 100}%`;
            img.style.transform = 'scale(1.8)';
        });
        mainImageContainer.addEventListener('mouseleave', function() {
            const img = this.querySelector('img');
            if (img) { img.style.transformOrigin = 'center'; img.style.transform = 'scale(1)'; }
        });
    }

    // Navigation AJAX produits similaires
    container.querySelectorAll('.ajax-product-link').forEach(link => {
        link.addEventListener('click', function(e) {
            e.preventDefault();
            const url = this.href;
            container.classList.add('loading-fade');
            fetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
            .then(r => r.text())
            .then(html => {
                setTimeout(() => {
                    container.innerHTML = html;
                    container.classList.remove('loading-fade');
                    window.history.pushState({}, '', url);
                    initializeProductDetail();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }, 100);
            })
            .catch(() => { window.location.href = url; });
        });
    });

    // Optionnel: sélectionner la première boutique par défaut 
    if (!selectedStore && stores.length > 0) {
        selectedStore = stores[0].id;
    }
    
    // Optionnel: sélectionner la première variante disponible si rien sélectionné
    if (!selectedColor && !selectedCap && Object.keys(variants).length > 0) {
        let firstKey = Object.keys(variants)[0];
        let parts = firstKey.split('_');
        if(parts.length === 2) {
            selectedColor = parts[0];
            selectedCap = parts[1];
        }
    }

    updateUI();
}

document.addEventListener('DOMContentLoaded', initializeProductDetail);
window.addEventListener('popstate', () => { window.location.reload(); });
</script>
{% endblock %}
